[global_config]
temp_dir = "./temp"
[logging]
# 日志器名称
name = "tk-bi-demo"

# 日志级别 (DEBUG, INFO, WARNING, ERROR, CRITICAL)
level = "DEBUG"

# 日志格式
format = "%(asctime)s - %(name)s - %(caller_filename)s - %(caller_lineno)s - %(levelname)s - %(message)s"

# 日志文件路径
file_path = "logs/app.log"

# 日志文件最大字节数 (10MB)
max_bytes = 10485760

# 备份文件数量
backup_count = 5

# 日志轮转方式 (size 或 time)
rotation_type = "size"

# 日志轮转时间间隔 (当rotation_type为time时使用)
# 可选值: S(秒), M(分), H(小时), D(天), midnight(午夜), W0-W6(周一到周日)
rotation_interval = "midnight"


[retry]
max_retry = 3
retry_delay = 1


[db_config]
# 数据库基本配置
database = "test_db"  # 数据库名称
driver = "pymysql"              # 数据库驱动 (pymysql, psycopg2, sqlite等)
dialect = "mysql"               # 数据库方言 (mysql, postgresql, sqlite等)
charset = "utf8mb4"             # 字符集
collation = "utf8mb4_0900_ai_ci" # 排序规则


# SQLAlchemy 引擎配置
echo = false          # 是否打印SQL语句到控制台
pool_size = 5         # 连接池大小
max_overflow = 10     # 连接池最大溢出连接数
pool_timeout = 30     # 获取连接的超时时间（秒）
pool_recycle = 3600   # 连接回收时间（秒）
pool_pre_ping = true  # 连接前是否ping测试连接有效性


# 连接配置
default_port = 3306        # 默认端口（当环境变量未设置时使用）
connection_timeout = 30    # 连接超时时间
read_timeout = 30          # 读取超时时间
write_timeout = 30         # 写入超时时间

[oauth]
[oauth.baidu]
refresh_token_time_delta = 2 # 刷新token时间间隔
controler_name = '金蛛账户中心'

[report_config]
[report_config.baidu]
user_name_list = ["金蛛-新账户5"]
report_list = ["keyword_day","keyword_hour"]
[report_config.baidu.keyword_day]
reportType = "2602783"
timeUnit = "DAY"
startDate = '2025-08-01'
endDate = '2025-08-03'
# date_range = 'week'
columns = []
sorts = []
filters = []
needSum = false
[report_config.baidu.keyword_hour]
reportType = "2602783"
timeUnit = "HOUR"
startDate = '2025-08-01'
endDate = '2025-08-03'
# date_range = 'week'
columns = []
sorts = []
filters = []
needSum = false


[http_config]
# 超时配置
timeout = 30.0  # 总超时时间（秒）
connect_timeout = 10.0  # 连接超时时间（秒）
read_timeout = 30.0  # 读取超时时间（秒）

# 重试配置
max_retries = 3  # 最大重试次数
retry_delay = 1.0  # 重试基础延迟时间（秒）
retry_backoff_factor = 2.0  # 重试退避因子

# 日志配置
log_level = "DEBUG"  # 日志级别
log_requests = true  # 是否记录请求日志
log_responses = true  # 是否记录响应日志
log_file_path = "logs/app.log"  # 日志文件路径，如果设置则持久化到文件
log_file_max_size = 10485760  # 日志文件最大大小（字节），默认10MB
log_file_backup_count = 5  # 日志文件备份数量
log_file_rotation_enabled = false  # 是否启用日志文件轮转，当日志文件被多个组件共享时建议设为False

# 请求配置
headers = {}
user_agent= "HttpClient/0.1.0"

# HTTP配置
follow_redirects = true  # 是否跟随重定向
verify_ssl = true  # 是否验证SSL证书


